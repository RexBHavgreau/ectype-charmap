name: Build Ectype Charmap for Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name EctypeCharmap main.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ectype-charmap-windows
          path: dist/EctypeCharmap.exe
          if-no-files-found: error